<!doctype html>
<!-- The link preview image (static/og.jpg, 1200×630). Re-render with assets/og/render.sh. -->
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<style>
			@font-face {
				font-family: 'Inter';
				src: url('../../node_modules/@fontsource-variable/inter/files/inter-latin-wght-normal.woff2')
					format('woff2');
				font-weight: 100 900;
			}
			* {
				margin: 0;
				box-sizing: border-box;
			}
			html,
			body {
				width: 1200px;
				height: 630px;
				overflow: hidden;
			}
			body {
				position: relative;
				font-family: 'Inter', sans-serif;
				color: #fff;
				background: radial-gradient(120% 90% at 50% 45%, #1f5a3f 0%, #143d2b 55%, #0d2a1d 100%);
			}
			svg.court {
				position: absolute;
				inset: 0;
			}
			/* Darkens the court behind the words so they stay easy to read. */
			.shade {
				position: absolute;
				inset: 0;
				background: radial-gradient(42% 46% at 50% 54%, rgb(13 42 29 / 0.85), transparent 100%);
			}
			main {
				position: absolute;
				inset: 0;
				display: flex;
				flex-direction: column;
				align-items: center;
				justify-content: center;
				text-align: center;
				padding-bottom: 6px;
			}
			.ball {
				width: 168px;
				height: 168px;
				filter: drop-shadow(0 0 48px rgb(214 243 61 / 0.45))
					drop-shadow(0 16px 24px rgb(0 0 0 / 0.35));
			}
			h1 {
				margin-top: 34px;
				font-size: 84px;
				font-weight: 760;
				letter-spacing: -0.045em;
				line-height: 1;
			}
			p {
				margin-top: 22px;
				font-size: 34px;
				font-weight: 450;
				letter-spacing: -0.015em;
				color: rgb(255 255 255 / 0.78);
			}
			p b {
				color: #d6f33d;
				font-weight: 600;
			}
		</style>
	</head>
	<body>
		<!-- A tennis court seen from above: 23.77 m × 10.97 m, drawn at 46.3 px per metre. -->
		<svg
			class="court"
			viewBox="0 0 1200 630"
			fill="none"
			stroke="#fff"
			stroke-opacity="0.16"
			stroke-width="5"
		>
			<rect x="50" y="61" width="1100" height="508" />
			<line x1="50" y1="124.5" x2="1150" y2="124.5" />
			<line x1="50" y1="505.5" x2="1150" y2="505.5" />
			<line x1="304" y1="124.5" x2="304" y2="505.5" />
			<line x1="896" y1="124.5" x2="896" y2="505.5" />
			<line x1="304" y1="315" x2="896" y2="315" />
			<line x1="50" y1="315" x2="68" y2="315" />
			<line x1="1132" y1="315" x2="1150" y2="315" />
			<!-- The net, left out where it would run through the words. -->
			<line x1="600" y1="36" x2="600" y2="150" stroke-opacity="0.28" stroke-width="7" />
			<line x1="600" y1="500" x2="600" y2="594" stroke-opacity="0.28" stroke-width="7" />
		</svg>
		<div class="shade"></div>
		<main>
			<svg class="ball" viewBox="0 0 64 64">
				<defs>
					<clipPath id="b"><circle cx="32" cy="32" r="28.5" /></clipPath>
				</defs>
				<circle cx="32" cy="32" r="28.5" fill="#d6f33d" />
				<g clip-path="url(#b)" fill="none" stroke="#fff" stroke-width="4">
					<circle cx="-6.5" cy="32" r="25" />
					<circle cx="70.5" cy="32" r="25" />
				</g>
				<circle cx="32" cy="32" r="28.5" fill="none" stroke="#a8c41c" stroke-width="2" />
			</svg>
			<h1>Book the tennis court</h1>
			<p>Tap a free time, add your name, done. <b>No account needed.</b></p>
		</main>
	</body>
</html>
