<!doctype html>
<!-- The home screen / small link preview icon (static/apple-touch-icon.png, 180×180). -->
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<style>
			* {
				margin: 0;
			}
			html,
			body {
				width: 180px;
				height: 180px;
				overflow: hidden;
			}
			body {
				display: grid;
				place-items: center;
				background: radial-gradient(90% 90% at 50% 40%, #1f5a3f 0%, #143d2b 70%, #0d2a1d 100%);
			}
			svg {
				width: 124px;
				height: 124px;
				filter: drop-shadow(0 6px 10px rgb(0 0 0 / 0.3));
			}
		</style>
	</head>
	<body>
		<svg viewBox="0 0 64 64">
			<defs>
				<clipPath id="b"><circle cx="32" cy="32" r="28.5" /></clipPath>
			</defs>
			<circle cx="32" cy="32" r="28.5" fill="#d6f33d" />
			<g clip-path="url(#b)" fill="none" stroke="#fff" stroke-width="4">
				<circle cx="-6.5" cy="32" r="25" />
				<circle cx="70.5" cy="32" r="25" />
			</g>
			<circle cx="32" cy="32" r="28.5" fill="none" stroke="#a8c41c" stroke-width="2" />
		</svg>
	</body>
</html>
